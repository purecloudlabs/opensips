	pn_get_country_mobile_token(54, $var(out));
	route(check, "get_country_mobile_token", 1, $rc, "9", $var(out));
	pn_get_country_mobile_token(36, $var(out));
	route(check, "get_country_mobile_token none", -1, $rc, "<unset>", $var(out));

	pn_get_ndd_prefix_for_region("HU", 0, $var(out));
	route(check, "get_ndd_prefix_for_region", 1, $rc, "06", $var(out));
	pn_get_ndd_prefix_for_region("US", 1, $var(out));
	route(check, "get_ndd_prefix_for_region US", 1, $rc, "1", $var(out));
	pn_get_ndd_prefix_for_region("hu", 1, $var(out));
	route(check, "get_ndd_prefix_for_region strip", 1, $rc, "06", $var(out));
	pn_get_ndd_prefix_for_region("US", 0, $var(out));
	route(check, "get_ndd_prefix_for_region US", 1, $rc, "1", $var(out));
	pn_get_ndd_prefix_for_region("XX", 0, $var(out));
	route(check, "get_ndd_prefix_for_region unknown", -1, $rc, "<unset>", $var(out));

	pn_is_nanpa_country("US");
	route(check, "is_nanpa_country US", 1, $rc);
	pn_is_nanpa_country("bs");
	route(check, "is_nanpa_country lowercase", 1, $rc);
	pn_is_nanpa_country("DE");
	route(check, "is_nanpa_country DE", -1, $rc);

	pn_get_example_number("US", $var(out));
	route(check, "get_example_number", 1, $rc, "+12015550123", $var(out));
	pn_get_example_number("GB", $var(out), "MOBILE");
	route(check, "get_example_number MOBILE", 1, $rc, "+447400123456", $var(out));
	pn_get_example_number("US", $var(out), "VOICEMAIL");
	route(check, "get_example_number missing type", -1, $rc, "<unset>", $var(out));
	pn_get_example_number("XX", $var(out));
	route(check, "get_example_number unknown region", -1, $rc, "<unset>", $var(out));
	pn_get_example_number("US", $var(out), "NOPE");
	route(check, "get_example_number bad type", -3, $rc, "<unset>", $var(out));
}

route[short_numbers] {
	pn_is_emergency_number("911", "US");
	route(check, "is_emergency_number US", 1, $rc);
	pn_is_emergency_number("112");
	route(check, "is_emergency_number default_region", 1, $rc);
	pn_is_emergency_number("999");
	route(check, "is_emergency_number GB", 1, $rc);
	pn_is_emergency_number("9116666666", "US");
	route(check, "is_emergency_number longer", -1, $rc);
	pn_is_emergency_number("911", "ZZ");
	route(check, "is_emergency_number unknown region", -1, $rc);

	pn_connects_to_emergency_number("9116666666", "US");
	route(check, "connects_to_emergency_number prefix", 1, $rc);
	pn_connects_to_emergency_number("1906666666", "BR");
	route(check, "connects_to_emergency_number exact region", -1, $rc);
	pn_connects_to_emergency_number("190", "BR");
	route(check, "connects_to_emergency_number exact", 1, $rc);
	pn_connects_to_emergency_number("4911", "US");
	route(check, "connects_to_emergency_number no match", -1, $rc);

	pn_is_valid_short_number("110", "FR");
	route(check, "is_valid_short_number", 1, $rc);
	pn_is_valid_short_number("123456", "FR");
	route(check, "is_valid_short_number invalid", -1, $rc);
