	route(check, "is_possible_number_with_reason IS_POSSIBLE DE", 1, $rc, "IS_POSSIBLE", $var(out));
	pn_is_possible_number_with_reason("+3761234567", $var(out));
	route(check, "is_possible_number_with_reason INVALID_LENGTH", -1, $rc, "INVALID_LENGTH", $var(out));
	pn_is_possible_number_with_reason("+29812345678", $var(out));
	route(check, "is_possible_number_with_reason TOO_LONG FO", -1, $rc, "TOO_LONG", $var(out));
	pn_is_possible_number_with_reason("", $var(out));
	route(check, "is_possible_number_with_reason invalid", -2, $rc, "<unset>", $var(out));

	pn_is_possible_number_for_type("+447912345678", "MOBILE");
	route(check, "is_possible_number_for_type", 1, $rc);
	pn_is_possible_number_for_type("+44791234567", "MOBILE");
	route(check, "is_possible_number_for_type too short", -1, $rc);
	pn_is_possible_number_for_type("+447912345678", "mobile");
	route(check, "is_possible_number_for_type lowercase", 1, $rc);
