	route(check, "is_possible_number_for_type bad type", -3, $rc);
	pn_is_possible_number_for_type("", "MOBILE");
	route(check, "is_possible_number_for_type invalid", -2, $rc);

	pn_is_possible_number_for_string("650 253 0000", "US");
	route(check, "is_possible_number_for_string", 1, $rc);
	pn_is_possible_number_for_string("+44 20 7031 3000", "US");
