}

startup_route {
	$var(passed) = 0;
	$var(failed) = 0;
	$var(out) = "<unset>";

	route(string_ops);
	route(formatting);
	route(number_info);
	route(validation);
	route(metadata);
	route(short_numbers);

	xlog("L_NOTICE", "LIBPHONENUMBER TESTS DONE: passed=$var(passed) failed=$var(failed)\n");
}

route {
	exit;
}
