route[validation] {
	pn_is_valid_number("+16502530000");
	route(check, "is_valid_number", 1, $rc);
	pn_is_valid_number("650 253 0000", "US");
	route(check, "is_valid_number national", 1, $rc);
	pn_is_valid_number("650 253 0000");
	route(check, "is_valid_number default_region", -1, $rc);
	pn_is_valid_number("+1 650 253 000");
	route(check, "is_valid_number too short", -1, $rc);
	pn_is_valid_number("");
	route(check, "is_valid_number invalid", -2, $rc);

	pn_is_valid_number_for_region("+12042345678", "CA");
	route(check, "is_valid_number_for_region", 1, $rc);
	pn_is_valid_number_for_region("+12042345678", "US");
	route(check, "is_valid_number_for_region other", -1, $rc);
	pn_is_valid_number_for_region("204 234 5678", "ca", "CA");
	route(check, "is_valid_number_for_region national", 1, $rc);
	pn_is_valid_number_for_region("", "CA");
	route(check, "is_valid_number_for_region invalid", -2, $rc);

	pn_is_possible_number("+1 650 253 0000");
	route(check, "is_possible_number", 1, $rc);
	pn_is_possible_number("253 0000", "US");
	route(check, "is_possible_number local only", 1, $rc);
	pn_is_possible_number("+1 650 253 00000");
	route(check, "is_possible_number too long", -1, $rc);
	pn_is_possible_number("");
	route(check, "is_possible_number invalid", -2, $rc);

	pn_is_possible_number_with_reason("+1 650 253 0000", $var(out));
