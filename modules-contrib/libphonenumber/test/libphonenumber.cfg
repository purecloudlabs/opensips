	route(check, "is_number_match EXACT_MATCH", 1, $rc, "EXACT_MATCH", $var(out));
	pn_is_number_match("+16502530000", "650 253 0000", , "ZZ", $var(out));
	route(check, "is_number_match NSN_MATCH", 1, $rc, "NSN_MATCH", $var(out));
	pn_is_number_match("650 253 0000", "650 253 0000", "ZZ", "ZZ", $var(out));
	route(check, "is_number_match NSN_MATCH no country codes", 1, $rc, "NSN_MATCH", $var(out));
	pn_is_number_match("+16502530000", "650 253 0000", "US", "US", $var(out));
	route(check, "is_number_match regions", 1, $rc, "EXACT_MATCH", $var(out));
	pn_is_number_match("+16502530000", "6502530000", "US", "DE", $var(out));
	route(check, "is_number_match other region", -1, $rc, "NO_MATCH", $var(out));
	pn_is_number_match("+16502530000", "2530000", "US", "US", $var(out));
	route(check, "is_number_match SHORT_NSN_MATCH", 1, $rc, "SHORT_NSN_MATCH", $var(out));
	pn_is_number_match("+16502530000", "+442070313000", , , $var(out));
	route(check, "is_number_match NO_MATCH", -1, $rc, "NO_MATCH", $var(out));
	pn_is_number_match("+16502530000", "+16502530000");
	route(check, "is_number_match without output", 1, $rc);
	pn_is_number_match("", "+16502530000", , , $var(out));
	route(check, "is_number_match invalid", -2, $rc, "INVALID_NUMBER", $var(out));
}

