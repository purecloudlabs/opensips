#
# libphonenumber module - functional test bundle
#
# Every exported function is called from startup_route with valid, invalid
# and edge case inputs; the return code and the output variable are checked
# against the expected values. Run it through test/run-tests.sh, which
# fills in the module path and evaluates the summary line.
#

log_level = 3
stderror_enabled = yes
syslog_enabled = no
udp_workers = 1
socket = udp:127.0.0.1:@PORT@

mpath = "@MPATH@"
loadmodule "proto_udp.so"
loadmodule "libphonenumber.so"

# national numbers without an explicit region are parsed as British ones
modparam("libphonenumber", "default_region", "GB")

#
# $param(1) - test name
# $param(2) - expected return code
# $param(3) - actual return code
# $param(4) - expected output (optional)
# $param(5) - actual output (optional)
#
route[check] {
	$var(ok) = 1;
	if ($param(2) != $param(3))
		$var(ok) = 0;
	if ($param(4) != NULL && $param(4) != $param(5))
		$var(ok) = 0;

	if ($var(ok) == 1) {
		$var(passed) = $var(passed) + 1;
		xlog("L_INFO", "[PASS] $param(1)\n");
	} else {
		$var(failed) = $var(failed) + 1;
		xlog("L_ERR", "[FAIL] $param(1): expected rc=<$param(2)> out=<$param(4)>, got rc=<$param(3)> out=<$param(5)>\n");
	}
	$var(out) = "<unset>";
}

route[string_ops] {
	pn_convert_alpha_characters_in_number("1-800-FLOWERS", $var(out));
	route(check, "convert_alpha", 1, $rc, "1-800-3569377", $var(out));
	pn_convert_alpha_characters_in_number("", $var(out));
	route(check, "convert_alpha empty", -1, $rc, "<unset>", $var(out));

	pn_normalize_digits_only("+1 (650) 253-0000", $var(out));
	route(check, "normalize_digits_only", 1, $rc, "16502530000", $var(out));
	pn_normalize_digits_only("abc", $var(out));
	route(check, "normalize_digits_only no digits", -1, $rc, "<unset>", $var(out));

	pn_normalize_diallable_chars_only("+1 (650) 253-0000*#", $var(out));
	route(check, "normalize_diallable_chars_only", 1, $rc, "+16502530000*#", $var(out));
	pn_normalize_diallable_chars_only("abc", $var(out));
	route(check, "normalize_diallable_chars_only nothing diallable", -1, $rc, "<unset>", $var(out));

	pn_is_alpha_number("1800 six-flags");
	route(check, "is_alpha_number true", 1, $rc);
	pn_is_alpha_number("1800 123-1234");
	route(check, "is_alpha_number false", -1, $rc);
}

route[formatting] {
	pn_format("650 253 0000", "E164", $var(out), "US");
	route(check, "format E164", 1, $rc, "+16502530000", $var(out));
	pn_format("650 253 0000", "INTERNATIONAL", $var(out), "US");
	route(check, "format INTERNATIONAL", 1, $rc, "+1 650-253-0000", $var(out));
	pn_format("650 253 0000", "NATIONAL", $var(out), "US");
	route(check, "format NATIONAL", 1, $rc, "(650) 253-0000", $var(out));
	pn_format("650 253 0000", "RFC3966", $var(out), "US");
	route(check, "format RFC3966", 1, $rc, "tel:+1-650-253-0000", $var(out));
	pn_format("650 253 0000", "e164", $var(out), "us");
	route(check, "format case insensitive", 1, $rc, "+16502530000", $var(out));
	pn_format("650 253 0000", "1", $var(out), "US");
	route(check, "format numeric", 1, $rc, "+1 650-253-0000", $var(out));
	$var(fmt) = "NATIONAL";
	$var(num) = "+442070313000";
	pn_format($var(num), $var(fmt), $var(out));
	route(check, "format from variables", 1, $rc, "020 7031 3000", $var(out));
	pn_format("020 7031 3000", "E164", $var(out));
	route(check, "format default_region", 1, $rc, "+442070313000", $var(out));
	pn_format("020 7031 3000", "E164", $var(out), "");
	route(check, "format empty region", 1, $rc, "+442070313000", $var(out));
	pn_format("020 7031 3000", "E164", $var(out), "ZZ");
	route(check, "format unknown region", -2, $rc, "<unset>", $var(out));
	pn_format("650 253 0000", "BOGUS", $var(out), "US");
	route(check, "format bad format", -3, $rc, "<unset>", $var(out));
	pn_format("650 253 0000", "4", $var(out), "US");
	route(check, "format out of range", -3, $rc, "<unset>", $var(out));
	pn_format("not a number", "E164", $var(out), "US");
	route(check, "format not a number", -2, $rc, "<unset>", $var(out));
	pn_format("+1 650 253 0000 ext. 1234", "INTERNATIONAL", $var(out));
	route(check, "format extension", 1, $rc, "+1 650-253-0000 ext. 1234", $var(out));
	pn_format("+1 650 253 0000 ext. 1234567890", "RFC3966", $var(out));
	route(check, "format long output", 1, $rc, "tel:+1-650-253-0000;ext=1234567890", $var(out));

	pn_format_in_original_format("(650) 253-0000", "US", $var(out), "US");
	route(check, "format_in_original_format national", 1, $rc, "(650) 253-0000", $var(out));
	pn_format_in_original_format("+16502530000", "US", $var(out));
	route(check, "format_in_original_format plus", 1, $rc, "+1 650-253-0000", $var(out));
	pn_format_in_original_format("011 44 20 7031 3000", "US", $var(out), "US");
	route(check, "format_in_original_format idd", 1, $rc, "011 44 20 7031 3000", $var(out));
	pn_format_in_original_format("x", "US", $var(out), "US");
	route(check, "format_in_original_format invalid", -2, $rc, "<unset>", $var(out));

	pn_format_national_number_with_carrier_code("011 2345 6789", "15", $var(out), "BR");
	route(check, "format_national_number_with_carrier_code", 1, $rc, "0 15 (11) 2345-6789", $var(out));
	pn_format_national_number_with_carrier_code("650 253 0000", "15", $var(out), "US");
	route(check, "format_national_number_with_carrier_code no pattern", 1, $rc, "(650) 253-0000", $var(out));
	pn_format_national_number_with_carrier_code("", "15", $var(out), "BR");
	route(check, "format_national_number_with_carrier_code invalid", -2, $rc, "<unset>", $var(out));

	pn_format_national_number_with_preferred_carrier_code("0 12 11 2345 6789", "15", $var(out), "BR");
	route(check, "format_national_number_with_preferred_carrier_code keeps", 1, $rc, "0 12 (11) 2345-6789", $var(out));
	pn_format_national_number_with_preferred_carrier_code("011 2345 6789", "15", $var(out), "BR");
	route(check, "format_national_number_with_preferred_carrier_code fallback", 1, $rc, "0 15 (11) 2345-6789", $var(out));
	pn_format_national_number_with_preferred_carrier_code("+", "15", $var(out), "BR");
	route(check, "format_national_number_with_preferred_carrier_code invalid", -2, $rc, "<unset>", $var(out));

	pn_format_number_for_mobile_dialing("+16502530000", "US", 1, $var(out));
	route(check, "format_number_for_mobile_dialing same country", 1, $rc, "+1 650-253-0000", $var(out));
	pn_format_number_for_mobile_dialing("+16502530000", "GB", 1, $var(out));
	route(check, "format_number_for_mobile_dialing other country", 1, $rc, "+1 650-253-0000", $var(out));
	pn_format_number_for_mobile_dialing("+16502530000", "GB", 0, $var(out));
	route(check, "format_number_for_mobile_dialing unformatted", 1, $rc, "+16502530000", $var(out));
	pn_format_number_for_mobile_dialing("1300123456", "AU", 1, $var(out), "AU");
	route(check, "format_number_for_mobile_dialing national only", 1, $rc, "1300 123 456", $var(out));
	pn_format_number_for_mobile_dialing("1300123456", "US", 1, $var(out), "AU");
	route(check, "format_number_for_mobile_dialing not dialable", -1, $rc, "<unset>", $var(out));
	pn_format_number_for_mobile_dialing("?", "US", 1, $var(out));
	route(check, "format_number_for_mobile_dialing invalid", -2, $rc, "<unset>", $var(out));

	pn_format_out_of_country_calling_number("+16502530000", "DE", $var(out));
	route(check, "format_out_of_country_calling_number DE", 1, $rc, "00 1 650-253-0000", $var(out));
	pn_format_out_of_country_calling_number("+16502530000", "JP", $var(out));
	route(check, "format_out_of_country_calling_number JP", 1, $rc, "010 1 650-253-0000", $var(out));
	pn_format_out_of_country_calling_number("+16502530000", "CA", $var(out));
	route(check, "format_out_of_country_calling_number NANPA", 1, $rc, "1 (650) 253-0000", $var(out));
	pn_format_out_of_country_calling_number("+16502530000", "ZZ", $var(out));
	route(check, "format_out_of_country_calling_number unknown region", 1, $rc, "+1 650-253-0000", $var(out));
	pn_format_out_of_country_calling_number("", "DE", $var(out));
	route(check, "format_out_of_country_calling_number invalid", -2, $rc, "<unset>", $var(out));

	pn_format_out_of_country_keeping_alpha_chars("1800 six-flag", "AU", $var(out), "US");
	route(check, "format_out_of_country_keeping_alpha_chars", 1, $rc, "0011 1 800 SIX-FLAG", $var(out));
	pn_format_out_of_country_keeping_alpha_chars("", "AU", $var(out), "US");
	route(check, "format_out_of_country_keeping_alpha_chars invalid", -2, $rc, "<unset>", $var(out));

	pn_truncate_too_long_number("+165025300001", $var(out));
	route(check, "truncate_too_long_number", 1, $rc, "+16502530000", $var(out));
	pn_truncate_too_long_number("+16502530000", $var(out));
	route(check, "truncate_too_long_number valid", 1, $rc, "+16502530000", $var(out));
	pn_truncate_too_long_number("+1650", $var(out));
	route(check, "truncate_too_long_number impossible", -1, $rc, "<unset>", $var(out));
	pn_truncate_too_long_number("", $var(out));
	route(check, "truncate_too_long_number invalid", -2, $rc, "<unset>", $var(out));
}

